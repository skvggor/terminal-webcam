[project]
name = "terminal-webcam"
version = "0.1.0"
description = "Capture your webcam and render it as ASCII art in the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "minify-html>=0.15",
    "rcssmin>=1.1",
    "rjsmin>=1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=ascii_art --cov=webcam --cov=capture --cov=color --cov=build_site --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
